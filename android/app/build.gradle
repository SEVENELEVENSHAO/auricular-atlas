plugins {
    id 'com.android.application'
}

layout.buildDirectory.set(file('build-output-staging'))

android {
    namespace 'com.sevenelevenshao.auricularatlas'
    compileSdk 36

    sourceSets {
        main {
            assets.srcDirs = ['atlas-assets-staging']
        }
    }

    defaultConfig {
        applicationId 'com.sevenelevenshao.auricularatlas'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '1.1.1'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
