<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" type="image/png" href="./ear-icon.png"><title>Auricular Atlas</title></head><body>
<main id="stage" aria-label="Interactive auricular atlas"></main>
<div class="identity"><h1>Auricular Atlas</h1><span>Huang · Reference & surface editor</span></div>
<nav class="top-tools" aria-label="Atlas navigation"><button data-panel="library">Prescriptions</button><button data-panel="editor">Edit atlas</button><button data-panel="project">Project</button><button id="front">Front</button><button id="back">Back</button><button id="fit">Fit</button></nav>
<div class="layers" aria-label="Visible layers"><button id="markings-toggle" aria-pressed="true">Markings <span>01</span></button><button id="naturalLines-toggle" aria-pressed="true">Natural lines <span>03</span></button><button id="points-toggle" aria-pressed="true">Ear points <span>02</span></button><button id="labels-toggle" aria-pressed="true">Labels</button></div>
<aside id="drawer" hidden><header><h2 id="drawer-title"></h2><button id="close-drawer" aria-label="Close panel">×</button></header><div id="panel-content"></div></aside>
<section id="reference" hidden><header><strong id="reference-title">Book reference</strong><button id="ref-prev" aria-label="Previous book page">←</button><button id="ref-next" aria-label="Next book page">→</button><button id="ref-close" aria-label="Close reference">×</button></header><img id="reference-image" alt="Scanned page from the user's auricular treatment reference"><p>Original scan · English index pending review · Chinese OCR not used</p></section>
<section id="annotation-editor" hidden aria-label="Name new annotation"><label for="annotation-name-input"><span id="annotation-editor-title">Name annotation</span><textarea id="annotation-name-input" rows="2" maxlength="100" placeholder="Type a name"></textarea></label><button id="annotation-name-save" class="primary">Save name</button></section>
<section id="mark-inspector" hidden aria-label="Edit selected marking"></section>
<div id="label-edit-overlay" hidden aria-label="Edit selected label"><div id="label-edit-box"><button id="label-edit-move" class="label-edit-move" aria-label="Move label"><span class="sr-only">Move label</span></button><button id="label-edit-corner" class="label-edit-corner" aria-label="Resize and rotate label"><span class="sr-only">Resize and rotate label</span></button></div></div>
<div id="status" role="status">Loading ear geometry…</div><div id="mode-hint">Drag to rotate · Scroll to zoom · Right-drag to pan</div>
<script type="module" src="/src/main.js"></script></body></html>
